<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beaubook – Merchant Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg:           #f5f3ff;
        --surface:      #ffffff;
        --surface-2:    #faf9ff;
        --border:       #c4bfe8;
        --border-2:     #a89fd4;
        --text:         #1e1b4b;
        --text-muted:   #8b83b8;
        --text-light:   #b8b2d8;
        --input-bg:     #ffffff;
        --primary:      #6d28d9;
        --primary-2:    #7c3aed;
        --primary-bg:   #f3e8ff;
        --shadow-sm:    0 1px 4px rgba(109,40,217,0.10), 0 1px 3px rgba(0,0,0,0.07);
        --shadow:       0 4px 12px rgba(109,40,217,0.09), 0 1px 4px rgba(0,0,0,0.05);
        --shadow-lg:    0 10px 28px rgba(109,40,217,0.13), 0 4px 10px rgba(0,0,0,0.07);
        --radius-sm:    8px;
        --radius:       12px;
        --radius-lg:    16px;
        --radius-xl:    20px;
      }
      [data-theme="dark"] {
        --bg:           #13111e;
        --surface:      #1c1a2e;
        --surface-2:    #211f33;
        --border:       #2e2c45;
        --border-2:     #3a3858;
        --text:         #eeeaf8;
        --text-muted:   #9590b8;
        --text-light:   #6360a0;
        --input-bg:     #252340;
        --primary-bg:   #2a1f4e;
        --shadow-sm:    0 1px 3px rgba(0,0,0,0.3);
        --shadow:       0 4px 12px rgba(0,0,0,0.35);
        --shadow-lg:    0 10px 28px rgba(0,0,0,0.45);
      }
      html { font-size: 16px; -webkit-font-smoothing: antialiased; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        transition: background 0.2s, color 0.2s;
        line-height: 1.5;
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-light); }
      button, input, select, textarea { font-family: inherit; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
