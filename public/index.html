<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beaubook – Merchant Dashboard</title>
    <meta name="description" content="BeauBook — booking and business management for beauty and wellness businesses." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 112 112'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2313CEB1'/%3E%3Cstop offset='1' stop-color='%230EA890'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='112' height='112' rx='26' fill='url(%23g)'/%3E%3Cg transform='translate(56,56)'%3E%3Cline x1='0' y1='-16' x2='0' y2='-50' stroke='%23fff' stroke-width='20' stroke-linecap='round'/%3E%3Cline x1='0' y1='-16' x2='0' y2='-50' stroke='%23fff' stroke-width='20' stroke-linecap='round' transform='rotate(180)'/%3E%3Cline x1='0' y1='-16' x2='0' y2='-50' stroke='%23fff' stroke-width='20' stroke-linecap='round' transform='rotate(90)'/%3E%3Cline x1='0' y1='-16' x2='0' y2='-50' stroke='%23fff' stroke-width='20' stroke-linecap='round' transform='rotate(-90)'/%3E%3Ccircle cx='0' cy='0' r='8' fill='rgba(255,255,255,0.3)'/%3E%3Ccircle cx='0' cy='0' r='11' fill='none' stroke='%23F47B38' stroke-width='9'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg:           #f8f3e9;
        --surface:      #ffffff;
        --surface-2:    #fbf7ef;
        --border:       #e4dfcf;
        --border-2:     #d3cbb5;
        --text:         #1c2620;
        --text-muted:   #6e7a72;
        --text-light:   #a8afa5;
        --input-bg:     #ffffff;
        --primary:      #0f766e;
        --primary-2:    #0d9488;
        --primary-bg:   #e8fff9;
        --accent:       #e6784a;
        --accent-bg:    #fdece2;
        --shadow-sm:    0 1px 4px rgba(15,118,110,0.10), 0 1px 3px rgba(0,0,0,0.07);
        --shadow:       0 4px 12px rgba(15,118,110,0.09), 0 1px 4px rgba(0,0,0,0.05);
        --shadow-lg:    0 10px 28px rgba(15,118,110,0.13), 0 4px 10px rgba(0,0,0,0.07);
        --radius-sm:    8px;
        --radius:       12px;
        --radius-lg:    16px;
        --radius-xl:    20px;
      }
      [data-theme="dark"] {
        --bg:           #121815;
        --surface:      #1b231f;
        --surface-2:    #202a25;
        --border:       #2e3a34;
        --border-2:     #3b4a43;
        --text:         #eaf3ee;
        --text-muted:   #93a69c;
        --text-light:   #5e6f67;
        --input-bg:     #202a25;
        --primary-bg:   #16332c;
        --accent-bg:    #3a2317;
        --shadow-sm:    0 1px 3px rgba(0,0,0,0.3);
        --shadow:       0 4px 12px rgba(0,0,0,0.35);
        --shadow-lg:    0 10px 28px rgba(0,0,0,0.45);
      }
      html { font-size: 16px; -webkit-font-smoothing: antialiased; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        transition: background 0.2s, color 0.2s;
        line-height: 1.5;
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-light); }
      button, input, select, textarea { font-family: inherit; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
