[build]
  command = "npm run build"
  publish = "build"

# Proxy all /api/* calls to the deployed backend (Railway).
# Replace YOUR_RAILWAY_URL with your actual Railway backend URL after deploying.
[[redirects]]
  from   = "/api/*"
  to     = "https://YOUR_RAILWAY_URL/api/:splat"
  status = 200
  force  = true

# SPA fallback — lets React Router handle all routes client-side.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
